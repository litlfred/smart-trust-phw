name: Generated files are current

# Generated files: the BPMN drawings in input/images/ are generated from
# input/business-processes/*.bpmn by tools/render-bpmn/render_bpmn.ts:
# rebuild them at the pinned layers and fail if a committed one differs.
# Actions are pinned by commit SHA; bun installs from bun.lock with install
# scripts off.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bpmn-drawings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Lay down the pinned layers (index.lock.json)
        run: |
          python3 -c "import json;[print(m['harness'],m['repository'],m['ref']) for m in json.load(open('index.lock.json'))['mounts']]" > "$RUNNER_TEMP/mounts.txt"
          while read -r h r ref; do git clone -q --filter=blob:none --no-checkout "https://github.com/$r" "$h" && git -C "$h" checkout -q "$ref" && rm -rf "$h/.git"; done < "$RUNNER_TEMP/mounts.txt"
          bun install --frozen-lockfile --ignore-scripts
      - name: Chromium, for the BPMN renderer
        # The lockfile's own Playwright installs the browser build it expects.
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: The BPMN drawings are current
        run: bun tools/render-bpmn/render_bpmn.ts --check

  personas-page:
    # input/pagecontent/personas.md is written from scenarios/ by
    # tools/personas/gen_personas.ts; it reads only this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The personas page is current
        run: bun tools/personas/gen_personas.ts --check

  translation-templates:
    # The gettext templates (.pot) the translation team works from are
    # extracted from the page text, the BPMN drawings and the PlantUML
    # sources by smart-base's extract_translations.py, read at the smart-base
    # commit index.lock.json pins. Fail if a committed template differs
    # (the POT-Creation-Date header aside).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: smart-base's extraction script at the pinned commit
        run: |
          read -r repo ref < <(python3 -c "import json;m=next(m for m in json.load(open('index.lock.json'))['mounts'] if m['harness']=='smart-base');print(m['repository'],m['ref'])")
          git clone -q --filter=blob:none --no-checkout "https://github.com/$repo" "$RUNNER_TEMP/smart-base"
          git -C "$RUNNER_TEMP/smart-base" sparse-checkout set input/scripts
          git -C "$RUNNER_TEMP/smart-base" checkout -q "$ref"
      - name: The translation templates are current
        run: |
          python3 -I "$RUNNER_TEMP/smart-base/input/scripts/extract_translations.py" --ig-root . --canonical http://smart.who.int/trust-phw > /dev/null
          git add -N input
          if git diff -I '^"POT-Creation-Date: ' --exit-code -- '*.pot'; then echo "✓ translation templates current"; else echo "✗ re-run extract_translations.py (see AGENTS.md)"; exit 1; fi
